[project]
name = "afromedx"
version = "0.1.0"
description = "AfroMedX Clinical Search — RAG over Malawian guidelines"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pypdf>=4.0",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "scipy>=1.17.1",
  "google-genai>=1.0",
  "mistralai>=1.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
